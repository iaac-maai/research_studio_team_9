[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specsynth-ml"
version = "0.1.0"
description = "Product-level ML components for SpecSynth AI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "joblib>=1.3", "pyarrow>=15.0", "pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["02_Source"]
